<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Collection partagée — QuickCapture</title>
    <style>
      :root {
        --bg: #f6f6fa; --surface: #fff; --surface-2: #eeeef5; --border: #dfdfea;
        --text: #1c1c28; --muted: #6b6b80; --accent: #4f46e5; --accent-soft: #e8e7fd;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #13131a; --surface: #1c1c26; --surface-2: #272735; --border: #33334a;
          --text: #ececf4; --muted: #9c9cb4; --accent: #818cf8; --accent-soft: #2b2b52;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 56px; }
      h1 { margin: 0 0 4px; font-size: 24px; overflow-wrap: anywhere; }
      .muted { color: var(--muted); }
      #status { margin: 48px 0; text-align: center; color: var(--muted); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 24px; }
      article { min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
      article img { display: block; width: 100%; max-height: 420px; object-fit: contain; background: var(--surface-2); }
      .body { padding: 12px 14px 14px; }
      h2 { margin: 0 0 6px; font-size: 15px; overflow-wrap: anywhere; }
      blockquote { margin: 0 0 8px; padding-left: 12px; border-left: 3px solid var(--accent); white-space: pre-wrap; overflow-wrap: anywhere; }
      a { color: var(--accent); overflow-wrap: anywhere; }
      .meta { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
      .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
      .tags span { padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; }
      footer { margin-top: 36px; text-align: center; font-size: 12.5px; color: var(--muted); }
      .rich { margin: 0 0 8px; overflow-wrap: anywhere; }
      .rich > :first-child { margin-top: 0; }
      .rich :is(h1, h2, h3, h4, h5, h6) { margin: 0.6em 0 0.3em; line-height: 1.25; font-size: 1.05em; }
      .rich h1 { font-size: 1.35em; } .rich h2 { font-size: 1.2em; } .rich h3 { font-size: 1.1em; }
      .rich :is(p, ul, ol, pre, table) { margin: 0 0 0.6em; }
      .rich :is(ul, ol) { padding-left: 1.4em; }
      .rich code { padding: 0 4px; border-radius: 4px; background: var(--surface-2); font: 0.92em ui-monospace, Consolas, monospace; }
      .rich pre { padding: 8px 10px; border-radius: 6px; background: var(--surface-2); overflow-x: auto; }
      .rich pre code { padding: 0; background: none; }
      .rich .scroll { overflow-x: auto; }
      .rich table { border-collapse: collapse; font-size: 0.92em; }
      .rich :is(th, td) { padding: 4px 8px; border: 1px solid var(--border); text-align: left; vertical-align: top; }
      .rich th { background: var(--surface-2); }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Collection partagée</h1>
      <p id="count" class="muted"></p>
      <p id="status" role="status">Chargement…</p>
      <div id="grid" class="grid"></div>
      <footer>Partagé avec QuickCapture</footer>
    </main>

    <script>
      // ⚠️ À renseigner avant de publier cette page : l'URL de votre projet Supabase.
      const SHARE_API = 'https://uithydgxwtqymqynjfua.supabase.co/functions/v1/share';

      const $ = (id) => document.getElementById(id);
      const el = (tag, props = {}, ...children) => {
        const node = Object.assign(document.createElement(tag), props);
        node.append(...children.filter((c) => c != null));
        return node;
      };
      // Seuls les liens http(s) sont rendus cliquables.
      const safeUrl = (url) => {
        try {
          const u = new URL(url);
          return u.protocol === 'http:' || u.protocol === 'https:' ? u.href : '';
        } catch {
          return '';
        }
      };
      const link = (url, text) => {
        const href = safeUrl(url);
        return href ? el('a', { href, target: '_blank', rel: 'noopener noreferrer', textContent: text || href }) : document.createTextNode(text || url);
      };
      const hostname = (url) => {
        try {
          return new URL(url).hostname.replace(/^www\./, '');
        } catch {
          return '';
        }
      };

      // Mise en forme d'un texte : HTML relu dans un document inerte, puis
      // reconstruit balise par balise d'après une liste blanche. Jamais d'innerHTML.
      const KEEP = new Set(['H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'P', 'DIV', 'BR', 'HR', 'STRONG', 'EM', 'U', 'S', 'MARK', 'CODE', 'PRE', 'SUP', 'SUB',
        'BLOCKQUOTE', 'UL', 'OL', 'LI', 'TABLE', 'CAPTION', 'THEAD', 'TBODY', 'TFOOT', 'TR', 'TH', 'TD', 'A']);
      const DROP = new Set(['SCRIPT', 'STYLE', 'TEMPLATE', 'IFRAME', 'OBJECT', 'EMBED', 'SVG', 'MATH', 'IMG', 'VIDEO', 'AUDIO', 'FORM', 'INPUT', 'BUTTON', 'TEXTAREA', 'SELECT']);
      function cleanInto(source, target) {
        for (const node of source.childNodes) {
          if (node.nodeType === 3) target.append(node.data);
          if (node.nodeType !== 1) continue;
          const tag = node.tagName.toUpperCase();
          if (DROP.has(tag)) continue;
          if (!KEEP.has(tag) || (tag === 'A' && !safeUrl(node.getAttribute('href') || ''))) {
            cleanInto(node, target);
            continue;
          }
          const copy = document.createElement(tag);
          if (tag === 'A') Object.assign(copy, { href: safeUrl(node.getAttribute('href')), target: '_blank', rel: 'noopener noreferrer' });
          for (const attr of ['colspan', 'rowspan']) {
            const n = parseInt(node.getAttribute(attr), 10);
            if ((tag === 'TD' || tag === 'TH') && n > 1 && n <= 50) copy.setAttribute(attr, String(n));
          }
          cleanInto(node, copy);
          // Un tableau large défile dans sa carte au lieu de la déborder.
          target.append(tag === 'TABLE' ? el('div', { className: 'scroll' }, copy) : copy);
        }
      }
      function richText(html) {
        const box = el('div', { className: 'rich' });
        cleanInto(new DOMParser().parseFromString(html, 'text/html').body, box);
        return box;
      }

      function card(item) {
        const body = el('div', { className: 'body' }, el('h2', { textContent: item.title || 'Sans titre' }));
        if (item.type === 'text') body.append(item.html ? richText(item.html) : el('blockquote', { textContent: item.content }));
        else if (item.type === 'link') body.append(el('p', { style: 'margin:0 0 8px' }, link(item.content)));

        const meta = el('div', { className: 'meta' }, new Date(item.createdAt).toLocaleDateString('fr-FR', { dateStyle: 'medium' }));
        if (item.url) meta.append(' · ', link(item.url, hostname(item.url) || 'source'));
        body.append(meta);

        if (item.tags?.length) {
          body.append(el('div', { className: 'tags' }, ...item.tags.map((t) => el('span', { textContent: `#${t}` }))));
        }
        const image = safeUrl(item.imageUrl);
        return el('article', {}, image ? el('img', { src: image, alt: item.title || '', loading: 'lazy' }) : null, body);
      }

      (async () => {
        const token = new URLSearchParams(location.search).get('t') || '';
        if (!token) {
          // Page ouverte sans lien de partage : ce n'est pas une erreur, il n'y a simplement rien à afficher.
          $('status').textContent = 'Cette page affiche une collection partagée depuis QuickCapture. Ouvrez le lien complet qui vous a été envoyé (il se termine par « ?t=… »).';
          return;
        }
        if (!/^[0-9a-f]{32,128}$/.test(token)) {
          $('status').textContent = 'Lien de partage invalide ou incomplet.';
          return;
        }
        try {
          const res = await fetch(`${SHARE_API}?t=${token}`);
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Ce lien de partage n’est plus actif.');
          document.title = `${data.collection} — QuickCapture`;
          $('title').textContent = data.collection;
          $('count').textContent = `${data.captures.length} capture(s)`;
          $('status').hidden = true;
          $('grid').append(...data.captures.map(card));
          if (!data.captures.length) {
            $('status').hidden = false;
            $('status').textContent = 'Cette collection est vide pour l’instant.';
          }
        } catch (err) {
          $('status').textContent = err.message || 'Chargement impossible.';
        }
      })();
    </script>
  </body>
</html>
